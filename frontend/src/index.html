<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ML Constructor</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236157ff'/%3E%3Cstop offset='1' stop-color='%232f6fe0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='8.5' r='3.1' fill='white'/%3E%3Ccircle cx='9.5' cy='23' r='3.1' fill='white'/%3E%3Ccircle cx='22.5' cy='23' r='3.1' fill='white'/%3E%3Cpath d='M16 11.5 L9.5 20 M16 11.5 L22.5 20' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <!-- Stage 22: the theme (and "animations off") before the first paint — see core/theme.ts -->
  <script>
    try {
      var m = localStorage.getItem('mlc.theme');
      if (m === 'dark' || (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('mlc-dark');
      }
      if (localStorage.getItem('mlc.motion') === 'off') document.documentElement.classList.add('no-motion');
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
